<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Administrador</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }
    
    h2 {
      color: #1a1a2e;
      margin-bottom: 25px;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #34495e;
      font-weight: 600;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #4a90e2;
      color: white;
    }
    
    .btn-primary:hover {
      background: #357abd;
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: #bdc3c7;
      color: #2c3e50;
      margin-top: 10px;
    }
    
    .btn-secondary:hover {
      background: #a0a7ab;
    }
    
    .message {
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
    }
    
    .message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>👤 Criar Novo Administrador</h2>
    <form id="cadastrarAdminForm">
      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" placeholder="admin@exemplo.com" required />
      </div>
      
      <div class="form-group">
        <label for="password">Senha *</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required />
      </div>
      
      <div class="form-group">
        <label for="passwordConfirm">Confirmar Senha *</label>
        <input type="password" id="passwordConfirm" placeholder="Digite a senha novamente" minlength="6" required />
      </div>
      
      <button type="submit" class="btn btn-primary" id="submitBtn">Criar Administrador</button>
      <a href="admin.html" class="btn btn-secondary" style="text-align: center; display: block; text-decoration: none;">Voltar ao Painel</a>
    </form>
    
    <div id="message" class="message"></div>
  </div>

<script>
  // Pega a instância do cliente Supabase criada no auth.js
  

  async function checkAuth() {
    const client = getSupabaseClient();
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      alert('Acesso restrito. Faça login primeiro.');
      window.location.href = 'login.html';
      return false;
    }
    return true;
  }

  document.getElementById('cadastrarAdminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Criando...';
    messageDiv.className = 'message';
    messageDiv.style.display = 'none';
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;
    
    if (!email || password.length < 6 || password !== passwordConfirm) {
      messageDiv.textContent = 'Verifique os dados informados. As senhas devem coincidir e ter no mínimo 6 caracteres.';
      messageDiv.className = 'message error';
      messageDiv.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Criar Administrador';
      return;
    }
    
    try {
      const client = getSupabaseClient();
      const { error } = await client.auth.signUp({
        email: email,
        password: password
      });
      
      if (error) throw error;
      
      messageDiv.textContent = '✅ Administrador criado com sucesso!';
      messageDiv.className = 'message success';
      messageDiv.style.display = 'block';
      
      document.getElementById('cadastrarAdminForm').reset();
      
      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 2000);
      
    } catch (error) {
      console.error('Erro ao criar admin:', error);
      messageDiv.textContent = '❌ Erro ao criar admin: ' + error.message;
      messageDiv.className = 'message error';
      messageDiv.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Criar Administrador';
    }
  });

  checkAuth();
</script>
</body>
</html>
