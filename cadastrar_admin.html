<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Admin Robótica</title>
    <link rel="icon" href="./styles/logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 45px 35px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-5px);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-card h2 {
            color: #1a1a2e;
            font-size: 26px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        
        .login-card p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 28px;
        }
        
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            color: #2c3e50;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .input-group input::placeholder {
            color: #adb5bd;
        }
        
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .btn-submit:disabled {
            background: #adb5bd;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }
        
        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: #667eea;
            transform: translateX(-5px);
        }
        
        .back-link::before {
            content: '← ';
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #bdc3c7;
            font-size: 12px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e9ecef;
        }
        
        .divider::before {
            margin-right: 15px;
        }
        
        .divider::after {
            margin-left: 15px;
        }

        .password-hint {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 4px;
            display: block;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            
            .login-card h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🤖</div>
        <h2>Criar Nova Conta</h2>
        <p>Cadastre-se para gerenciar o campeonato</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="infoMessage" class="info-message"></div>

        <form id="registerForm">
            <div class="input-group">
                <label for="name">👤 Nome Completo</label>
                <input type="text" id="name" placeholder="Digite seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">📧 E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">🔒 Senha</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                <span class="password-hint">A senha deve ter pelo menos 6 caracteres</span>
            </div>

            <div class="input-group">
                <label for="confirmPassword">✅ Confirmar Senha</label>
                <input type="password" id="confirmPassword" placeholder="Digite a senha novamente" required minlength="6">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Criar Conta</button>
        </form>

        <div class="divider">ou</div>
        
        <a href="login.html" class="back-link">Já tem uma conta? Faça login</a>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO DO SUPABASE - Usando a mesma do cadastrar.html
        // ============================================================
        const SUPABASE_URL = 'https://udsmloettgcwdvbyliwc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__g8VB-GPMjJ8Y6Dj26dmdg_a03LMGFj';
        
        // Cria o cliente diretamente (igual ao cadastrar.html)
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Torna global
        window.supabase = supabase;

        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const infoDiv = document.getElementById('infoMessage');
        const btnSubmit = document.getElementById('btnSubmit');
        const registerForm = document.getElementById('registerForm');

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
            infoDiv.style.display = 'none';
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            infoDiv.style.display = 'none';
        }

        function showInfo(message) {
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
        }

        function hideAllMessages() {
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            infoDiv.style.display = 'none';
        }

        // ============================================================
        // FUNÇÃO DE CADASTRO - IGUAL AO cadastrar.html
        // ============================================================
        async function handleRegister(event) {
            event.preventDefault();
            hideAllMessages();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validações
            if (!name) {
                showError('❌ Por favor, digite seu nome completo.');
                return;
            }

            if (!email) {
                showError('❌ Por favor, digite um e-mail válido.');
                return;
            }

            if (password.length < 6) {
                showError('❌ A senha deve ter pelo menos 6 caracteres.');
                return;
            }

            if (password !== confirmPassword) {
                showError('❌ As senhas não coincidem!');
                return;
            }

            // Desabilita o botão durante o cadastro
            btnSubmit.textContent = '⏳ Cadastrando...';
            btnSubmit.disabled = true;
            showInfo('⏳ Criando sua conta no Supabase...');

            try {
                // ============================================================
                // CHAMADA IGUAL AO cadastrar.html - COM O MESMO CLIENTE
                // ============================================================
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { 
                            name: name,
                            role: 'admin'
                        }
                    }
                });

                if (error) {
                    console.error('Erro do Supabase:', error);
                    
                    let errorMessage = error.message;
                    if (error.message.includes('User already registered')) {
                        errorMessage = '❌ Este e-mail já está cadastrado. Faça login ou use outro e-mail.';
                    } else if (error.message.includes('Password should be at least')) {
                        errorMessage = '❌ A senha deve ter pelo menos 6 caracteres.';
                    } else if (error.message.includes('Invalid email')) {
                        errorMessage = '❌ E-mail inválido. Verifique o formato.';
                    } else if (error.message.includes('rate limit')) {
                        errorMessage = '❌ Muitas tentativas. Aguarde alguns minutos e tente novamente.';
                    }
                    
                    showError('Erro ao cadastrar: ' + errorMessage);
                    btnSubmit.textContent = 'Criar Conta';
                    btnSubmit.disabled = false;
                    return;
                }

                if (data.user) {
                    console.log('✅ Usuário criado:', data.user);
                    
                    // Verifica se o usuário precisa confirmar email
                    if (data.user.identities && data.user.identities.length === 0) {
                        showError('⚠️ Este e-mail já está cadastrado, mas não confirmado. Verifique sua caixa de entrada.');
                        btnSubmit.textContent = 'Criar Conta';
                        btnSubmit.disabled = false;
                        return;
                    }
                    
                    // ============================================================
                    // SUCESSO - ENVIO DE EMAIL DE CONFIRMAÇÃO (gerenciado pelo Supabase)
                    // ============================================================
                    if (data.session) {
                        showSuccess('✅ Cadastro realizado com sucesso! Entrando...');
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1500);
                    } else {
                        // O Supabase enviou o email de confirmação automaticamente
                        showSuccess('✅ Cadastro realizado com sucesso! 📧 Verifique seu e-mail para confirmar a conta.');
                        btnSubmit.textContent = 'Criar Conta';
                        btnSubmit.disabled = false;
                        registerForm.reset();
                    }
                } else {
                    showError('⚠️ Resposta inesperada. Tente novamente.');
                    btnSubmit.textContent = 'Criar Conta';
                    btnSubmit.disabled = false;
                }

            } catch (error) {
                console.error('Erro no cadastro:', error);
                showError('❌ Erro inesperado: ' + error.message);
                btnSubmit.textContent = 'Criar Conta';
                btnSubmit.disabled = false;
            }
        }

        // Adiciona o evento ao formulário
        registerForm.addEventListener('submit', handleRegister);

        console.log('🚀 Página de cadastro carregada!');
        console.log('📡 Cliente Supabase criado com sucesso!');
    </script>
</body>
</html>
