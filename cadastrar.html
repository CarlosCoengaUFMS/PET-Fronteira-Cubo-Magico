<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Competidor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    
    h2 {
      color: #1a1a2e;
      margin-bottom: 25px;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #34495e;
      font-weight: 600;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #4a90e2;
      color: white;
    }
    
    .btn-primary:hover {
      background: #357abd;
      transform: translateY(-2px);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #bdc3c7;
      color: #2c3e50;
      margin-top: 10px;
    }
    
    .btn-secondary:hover {
      background: #a0a7ab;
    }
    
    .message {
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
    }
    
    .message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>➕ Cadastrar Competidor</h2>
    <form id="cadastrarForm">
      <div class="form-group">
        <label for="nome">Nome do Competidor *</label>
        <input type="text" id="nome" placeholder="Ex: João Silva" required />
      </div>
      
      <div class="form-group">
        <label for="foto">URL da Foto</label>
        <input type="url" id="foto" placeholder="https://exemplo.com/foto.jpg" />
      </div>
      
      <div class="form-group">
        <label for="t1">Tempo 1 (segundos) *</label>
        <input type="number" step="0.001" id="t1" placeholder="Ex: 12.345" required />
      </div>
      
      <div class="form-group">
        <label for="t2">Tempo 2 (segundos) *</label>
        <input type="number" step="0.001" id="t2" placeholder="Ex: 11.234" required />
      </div>
      
      <div class="form-group">
        <label for="t3">Tempo 3 (segundos) *</label>
        <input type="number" step="0.001" id="t3" placeholder="Ex: 13.456" required />
      </div>
      
      <button type="submit" class="btn btn-primary" id="submitBtn">Salvar Competidor</button>
      <a href="admin.html" class="btn btn-secondary" style="text-align: center; display: block; text-decoration: none;">Voltar ao Painel</a>
    </form>
    
    <div id="message" class="message"></div>
  </div>

  <script>
    function getSupabaseClient() {
      const client = getSupabaseClient();
      if (!client || !client.auth || typeof client.from !== 'function') {
        throw new Error('Supabase não foi inicializado. Verifique o auth.js e a ordem dos scripts.');
      }
      return client;
    }
    
    async function checkAuth() {
      const { data: { session } } = await getSupabaseClient().auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    document.getElementById('cadastrarForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const messageDiv = document.getElementById('message');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Salvando...';
      messageDiv.className = 'message';
      messageDiv.style.display = 'none';
      
      const nome = document.getElementById('nome').value.trim();
      const fotoUrl = document.getElementById('foto').value.trim() || null;
      const tempo1 = parseFloat(document.getElementById('t1').value);
      const tempo2 = parseFloat(document.getElementById('t2').value);
      const tempo3 = parseFloat(document.getElementById('t3').value);
      
      if (!nome || isNaN(tempo1) || isNaN(tempo2) || isNaN(tempo3)) {
        messageDiv.textContent = 'Por favor, preencha todos os campos corretamente.';
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Salvar Competidor';
        return;
      }

      const media = (tempo1 + tempo2 + tempo3) / 3;

      try {
        const { error } = await getSupabaseClient()
          .from('competidores')
          .insert([{
            nome: nome,
            foto_url: fotoUrl,
            tempo1: tempo1,
            tempo2: tempo2,
            tempo3: tempo3,
            media: media
          }]);
        
        if (error) throw error;
        
        messageDiv.textContent = '✅ Competidor salvo com sucesso!';
        messageDiv.className = 'message success';
        messageDiv.style.display = 'block';
        
        document.getElementById('cadastrarForm').reset();
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 2000);
        
      } catch (error) {
        console.error('Erro ao salvar:', error);
        messageDiv.textContent = '❌ Erro ao salvar: ' + error.message;
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Salvar Competidor';
      }
    });

    checkAuth();
  </script>
</body>
</html>
