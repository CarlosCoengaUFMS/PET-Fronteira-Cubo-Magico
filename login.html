<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin</title>
  
  <!-- Importando o Supabase e seu arquivo de configuração -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    
    .logo {
      font-size: 48px;
      display: block;
      text-align: center;
      margin-bottom: 10px;
    }
    
    h2 {
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 5px;
    }
    
    .subtitle {
      color: #7f8c8d;
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #34495e;
      font-weight: 600;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #4a90e2;
      color: white;
    }
    
    .btn-primary:hover {
      background: #357abd;
      transform: translateY(-2px);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .message {
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
      font-size: 14px;
    }
    
    .message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .links {
      text-align: center;
      margin-top: 15px;
    }
    
    .links a {
      color: #4a90e2;
      text-decoration: none;
      font-size: 14px;
    }
    
    .links a:hover {
      text-decoration: underline;
    }

    .debug-info {
      margin-top: 15px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 5px;
      font-size: 12px;
      color: #666;
      display: none;
      border: 1px solid #dee2e6;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="logo">🔐</span>
    <h2>Acesso Administrativo</h2>
    <p class="subtitle">Faça login para gerenciar o campeonato</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
      </div>
      
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password" />
      </div>
      
      <button type="submit" class="btn btn-primary" id="loginBtn">Entrar</button>
    </form>
    
    <div id="message" class="message"></div>
    <div id="debugInfo" class="debug-info"></div>
    
    <div class="links">
      <a href="index.html">🏠 Voltar para página inicial</a>
    </div>
  </div>

  <script>
    let isRedirecting = false;
    const debugDiv = document.getElementById('debugInfo');
    
    function showDebug(message) {
      debugDiv.style.display = 'block';
      debugDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
      console.log(message);
    }
    
    // Verifica se já está logado assim que a página carrega
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        showDebug('🔍 Verificando sessão existente...');
        const cliente = getSupabaseClient();
        const { data: { session }, error } = await cliente.auth.getSession();
        
        if (error) {
          showDebug('❌ Erro ao verificar sessão: ' + error.message);
        }
        
        if (session) {
          showDebug('✅ Sessão encontrada para: ' + session.user.email);
          if (!isRedirecting) {
            isRedirecting = true;
            window.location.replace('admin.html');
          }
        } else {
          showDebug('ℹ️ Nenhuma sessão ativa');
        }
      } catch (error) {
        showDebug('❌ Erro no DOMContentLoaded: ' + error.message);
        console.error('Erro ao verificar autenticação:', error);
      }
    });

    // Função que roda ao clicar em "Entrar"
    document.getElementById('loginForm').addEventListener('submit', async function handleLogin(event) {
      event.preventDefault();
      
      if (isRedirecting) return;
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      const messageDiv = document.getElementById('message');
      const btnSubmit = document.getElementById('loginBtn');
      
      messageDiv.style.display = 'none';
      messageDiv.classList.remove('error', 'success');
      debugDiv.style.display = 'none';
      debugDiv.innerHTML = '';
      
      btnSubmit.textContent = 'Autenticando...';
      btnSubmit.disabled = true;
      
      try {
        showDebug('🔐 Tentando login para: ' + email);
        const cliente = getSupabaseClient();
        
        if (!cliente) {
          throw new Error('Cliente Supabase não inicializado');
        }
        
        showDebug('📡 Enviando requisição para Supabase...');
        
        const { data, error } = await cliente.auth.signInWithPassword({
          email: email,
          password: password,
        });
        
        showDebug('📥 Resposta recebida');
        
        if (error) {
          showDebug('❌ Erro do Supabase: ' + JSON.stringify(error));
          messageDiv.classList.add('error');
          
          // Mensagens de erro mais específicas
          if (error.message.includes('Invalid login credentials')) {
            messageDiv.textContent = '❌ E-mail ou senha incorretos!';
          } else if (error.message.includes('Email not confirmed')) {
            messageDiv.textContent = '❌ E-mail não confirmado. Verifique sua caixa de entrada.';
          } else if (error.message.includes('User not found')) {
            messageDiv.textContent = '❌ Usuário não encontrado. Verifique o e-mail.';
          } else {
            messageDiv.textContent = '❌ ' + error.message;
          }
          
          messageDiv.style.display = 'block';
          btnSubmit.textContent = 'Entrar';
          btnSubmit.disabled = false;
          return;
        }
        
        if (data.user) {
          showDebug('✅ Login bem sucedido para: ' + data.user.email);
          showDebug('🆔 User ID: ' + data.user.id);
          
          isRedirecting = true;
          
          messageDiv.classList.add('success');
          messageDiv.textContent = '✅ Login realizado com sucesso! Redirecionando...';
          messageDiv.style.display = 'block';
          
          setTimeout(() => {
            window.location.replace('admin.html');
          }, 1000);
        } else {
          showDebug('⚠️ Nenhum usuário retornado, mas sem erro');
          throw new Error('Resposta inesperada do servidor');
        }
      } catch (error) {
        showDebug('💥 Erro capturado: ' + error.message);
        showDebug('📋 Stack: ' + error.stack);
        
        console.error('Login error completo:', error);
        
        messageDiv.classList.add('error');
        messageDiv.textContent = '❌ Erro: ' + error.message;
        messageDiv.style.display = 'block';
        
        btnSubmit.textContent = 'Entrar';
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
