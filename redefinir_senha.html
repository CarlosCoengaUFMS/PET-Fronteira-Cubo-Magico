<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Admin Robótica</title>
    <link rel="icon" href="./styles/logo.png" type="image/png">
    
    <!-- Importando o Supabase e o script de configuração -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 45px 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-card h2 {
            color: #1a1a2e;
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        
        .login-card p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            color: #2c3e50;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            background: #adb5bd;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: #667eea;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🔑</div>
        <h2>Redefinir Senha</h2>
        <p>Crie uma nova senha para sua conta</p>

        <div id="messageBox" class="message" style="display: none;"></div>

        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="newPassword">🔒 Nova Senha</label>
                <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="input-group">
                <label for="confirmPassword">✅ Confirmar Nova Senha</label>
                <input type="password" id="confirmPassword" placeholder="Digite a senha novamente" required minlength="6">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Atualizar Senha</button>
        </form>

        <a href="login.html" class="back-link">← Voltar para o login</a>
    </div>

    <script>
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const messageBox = document.getElementById('messageBox');
        const btnSubmit = document.getElementById('btnSubmit');

        function showMessage(msg, isError = false) {
            messageBox.style.display = 'block';
            messageBox.textContent = msg;
            messageBox.className = 'message ' + (isError ? 'error' : 'success');
        }

        // Evento de envio do formulário
        resetPasswordForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validações básicas
            if (newPassword.length < 6) {
                showMessage('❌ A nova senha deve ter pelo menos 6 caracteres.', true);
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('❌ As senhas não coincidem!', true);
                return;
            }

            btnSubmit.textContent = '⏳ Atualizando...';
            btnSubmit.disabled = true;

            try {
                // Recupera o cliente a partir do auth.js
                const cliente = window.getSupabaseClient();

                // O Supabase atualizará a senha do usuário autenticado no momento 
                // (a sessão foi criada automaticamente pelo link do e-mail)
                const { data, error } = await cliente.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    showMessage('❌ Erro ao atualizar senha: ' + error.message, true);
                    btnSubmit.textContent = 'Atualizar Senha';
                    btnSubmit.disabled = false;
                    return;
                }

                // Sucesso
                showMessage('✅ Senha atualizada com sucesso! Redirecionando para o login...');
                
                // Redireciona o usuário para o login após 2 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Erro:', error);
                showMessage('❌ Ocorreu um erro inesperado.', true);
                btnSubmit.textContent = 'Atualizar Senha';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
