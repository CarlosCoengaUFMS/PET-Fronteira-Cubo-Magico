<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campeonato de Cubo Mágico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    
    .logo {
      font-size: 80px;
      display: block;
      margin-bottom: 20px;
    }
    
    h1 {
      color: #1a1a2e;
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #7f8c8d;
      font-size: 16px;
      margin-bottom: 30px;
    }
    
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    
    .btn-primary {
      background: #4a90e2;
      color: white;
    }
    
    .btn-primary:hover {
      background: #357abd;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
    }
    
    .btn-secondary {
      background: #e74c3c;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #c0392b;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
    }
    
    .btn-outline {
      background: transparent;
      color: #4a90e2;
      border: 2px solid #4a90e2;
    }
    
    .btn-outline:hover {
      background: #4a90e2;
      color: white;
    }
    
    .footer {
      margin-top: 30px;
      color: #bdc3c7;
      font-size: 14px;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 40px 20px;
      }
      
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="logo">🏆</span>
    <h1>Campeonato de Cubo Mágico</h1>
    <p class="subtitle">Acompanhe os melhores tempos e a classificação oficial</p>
    
    <div class="btn-group">
      <a href="visitor.html" class="btn btn-primary">
        📊 Ver Ranqueamento Público
      </a>
      <a href="login.html" class="btn btn-secondary">
        🔐 Área Administrativa
      </a>
    </div>
    
    <div class="footer">
      <p>📱 Sistema de gerenciamento de competições</p>
    </div>
  </div>
</body>
</html>
